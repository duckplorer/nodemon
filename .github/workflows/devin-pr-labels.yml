name: Label Devin PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label Devin migration PRs
        if: startsWith(github.event.pull_request.title, '[Devin] TS Migration:')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ts-migration', 'devin']
            })

      - name: Label Devin issue-fix PRs
        if: startsWith(github.event.pull_request.title, '[Devin] Fix #')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['devin']
            })
